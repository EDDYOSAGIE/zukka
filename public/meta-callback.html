<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Meta Connect</title>
    <style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;padding:1.5rem;}main{max-width:560px;border:1px solid #e2e8f0;border-radius:1rem;background:#fff;padding:2rem;box-shadow:0 18px 40px rgba(15,23,42,.08);}button{margin-top:1.5rem;padding:.9rem 1.4rem;border:none;border-radius:.75rem;background:#0f172a;color:#fff;font-weight:800;cursor:pointer;}</style>
  </head>
  <body>
    <main>
      <h1>Finishing Meta connection…</h1>
      <p id="status">Waiting for the platform to finish connecting your Instagram and WhatsApp accounts.</p>
      <div id="actions" style="display:none;">
        <button id="close">Close</button>
        <a id="return" href="/">Return to dashboard</a>
      </div>
    </main>

    <script>
      (async function () {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');

        const statusEl = document.getElementById('status');
        const actionsEl = document.getElementById('actions');
        const closeBtn = document.getElementById('close');

        if (closeBtn) {
          closeBtn.addEventListener('click', () => window.close());
        }

        if (error) {
          if (statusEl) statusEl.textContent = 'Meta returned an error: ' + error;
          actionsEl.style.display = 'block';
          return;
        }

        if (!code) {
          if (statusEl) statusEl.textContent = 'No authorization code found in the URL.';
          actionsEl.style.display = 'block';
          return;
        }

        try {
          if (statusEl) statusEl.textContent = 'Finalizing connection...';

          const resp = await fetch('/v1/meta/finalize?code=' + encodeURIComponent(code), {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' }
          });

          const body = await resp.json().catch(() => ({}));

          if (!resp.ok) {
            if (statusEl) statusEl.textContent = 'Failed to finalize connection: ' + (body?.message || JSON.stringify(body));
            actionsEl.style.display = 'block';
            return;
          }

          if (statusEl) statusEl.textContent = 'Connected successfully. You can close this window.';
          actionsEl.style.display = 'block';
        } catch (err) {
          if (statusEl) statusEl.textContent = 'Network error: ' + err;
          actionsEl.style.display = 'block';
        }
      })();
    </script>
  </body>
</html>
